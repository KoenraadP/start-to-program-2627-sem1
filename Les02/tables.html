<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <!-- style voor CSS code -->
    <style>
        /* één rand voor tabel */
        table,
        td {
            border: solid 1px;
            border-collapse: collapse;
        }
    </style>
</head>

<body>
    <!-- tabel -->
    <table>
        <!-- tr = table row -->
        <tr>
            <!-- td = table data, één cel in de rij -->
            <td>Voornaam</td>
            <td>Sam</td>
        </tr>
        <tr>
            <!-- td = table data, één cel in de rij -->
            <td>Achternaam</td>
            <td>Vaneeckhoutte</td>
        </tr>
        <tr>
            <!-- td = table data, één cel in de rij -->
            <td>Woonplaats</td>
            <td>Wevelgem</td>
        </tr>
    </table>

    <br><br>

    <table>
        <tr>
            <th colspan="5">Uurrooster</th>
        </tr>
        <tr>
            <td></td>
            <td>09:00</td>
            <td>10:00</td>
            <td>11:00</td>
            <td>12:00</td>
        </tr>
        <tr>
            <td>Maandag</td>
            <td colspan="2">Aardrijkskunde</td>
            <td>Wiskunde</td>
            <td>ICT</td>
        </tr>
        <tr></tr>
    </table>

</body>

</html>
